<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug HTML dan CSS</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      h1 {
        color: navy;
      }

      .card {
        background: #dbe7f3;
        padding: 16px;
        margin-bottom: 20px;
      }

      .card h2 {
        font-size: 18px;
      }

      .center {
        text-align: center;
      }

      #news-list {
        border: 1px solid #999;
        padding: 16px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Halaman Berita Kampus</h1>
      <p>Informasi kegiatan dan berita terbaru kampus.</p>
    </header>

    <nav>
      <a href="index.html">Beranda</a>
      <a href="about.html">About</a>
    </nav>

    <main>
      <section class="card">
        <h2>Berita Kampus</h2>
        <p>Selamat datang di halaman berita kampus.</p>
      </section>

      <section id="news-list">
        <h2>Agenda Mendatang</h2>
        <ul>
          <li>Seminar teknologi</li>
          <li>Pelatihan pemrograman</li>
          <li>Kompetisi mahasiswa</li>
        </ul>
      </section>

      <section class="center">
        <h2>Foto Kampus</h2>
        <img
          src="https://placehold.co/400x200?text=Kampus"
          alt="Ilustrasi gedung kampus"
        />
      </section>
    </main>

    <footer class="center">
      <p>&copy; 2026 Berita Kampus</p>
    </footer>
  </body>
</html>
